<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller · Tillas Lab</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#131417">
<link rel="icon" type="image/png" sizes="180x180" href="marca/perfil-180.png">
<link rel="apple-touch-icon" href="marca/perfil-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Archivo+Black&family=Sigmar+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<script>document.documentElement.classList.add('js');</script>
</head>
<body class="pagina" style="min-height:100vh">

<header class="topbar-app">
  <div class="inner">
    <a class="lk lk-sm" href="index.html" aria-label="Tillas Lab"><img class="marca" src="marca/sello-80.png" alt="" width="38" height="38"><span class="palabra">Tillas Lab</span></a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="pedido.html">Pedir retiro</a>
      <a href="taller.html" class="on">Taller</a>
    </nav>
  </div>
</header>

<main class="wrap" style="padding:34px var(--pad-x) 70px;max-width:1080px">

  <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin-bottom:26px">
    <div class="col" style="gap:6px">
      <span class="lbl">panel del taller</span>
      <h1 class="h" style="font-size:2.3rem;color:var(--ink)">Fichas de hoy</h1>
    </div>
    <span style="font-size:.75rem;color:var(--faint);margin-left:auto" class="num" id="reloj"></span>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px" id="stats"></div>

  <div class="row" style="gap:8px;margin-bottom:16px" id="filtros">
    <button class="pill sel" data-f="todas">Todas</button>
    <button class="pill" data-f="taller">En taller</button>
    <button class="pill" data-f="listas">Listas</button>
    <button class="pill" data-f="entregadas">Entregadas</button>
  </div>

  <div id="tabla"></div>

  <p style="font-size:.75rem;color:var(--soft);margin-top:22px;line-height:1.6;max-width:60em">Las fichas se guardan en este navegador. Para que el taller y el cliente vean lo mismo desde distintos dispositivos hace falta base de datos: ese es el siguiente paso de desarrollo.</p>
</main>

<style>
@media (max-width:900px){ #stats{grid-template-columns:1fr 1fr!important} }
</style>

<script>
const KEY = "tillaslab_fichas";
const TEL_TALLER = "5493810000000";
const PASOS = ["Ficha y fotos","Cepillado en seco","Lavado en máquina","Desinfección con luz UV","Secado controlado","Control final"];
const money = n => "$" + n.toLocaleString("es-AR");
let filtro = "todas";

function fichas(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function guardar(l){ localStorage.setItem(KEY, JSON.stringify(l)); pintar(); }

function avanzar(n){
  const l = fichas();
  const f = l.find(x => x.n === n);
  if(!f) return;
  if(f.paso < PASOS.length) f.paso++;
  else f.entregada = true;
  guardar(l);
}
function volver(n){
  const l = fichas();
  const f = l.find(x => x.n === n);
  if(!f) return;
  if(f.entregada) f.entregada = false;
  else if(f.paso > 0) f.paso--;
  guardar(l);
}

function pintar(){
  const l = fichas().slice().sort((a,b) => b.n - a.n);
  const enTaller = l.filter(f => !f.entregada && f.paso < PASOS.length).length;
  const listas = l.filter(f => !f.entregada && f.paso >= PASOS.length).length;
  const entregadas = l.filter(f => f.entregada).length;
  const cobrado = l.filter(f => f.entregada).reduce((s,f) => s + f.total, 0);

  document.getElementById("stats").innerHTML = [
    ["Fichas", l.length, "var(--on-strong)"],
    ["En taller", enTaller, "var(--accent)"],
    ["Para entregar", listas, "var(--on-strong)"],
    ["Cobrado", money(cobrado), "var(--on-strong)"]
  ].map(([k,v,c]) => `<div class="card-dark col" style="gap:5px"><span class="label-dark">${k}</span><span class="num" style="font-size:1.6rem;font-weight:900;color:${c}">${v}</span></div>`).join("");

  let vista = l;
  if(filtro === "taller") vista = l.filter(f => !f.entregada && f.paso < PASOS.length);
  if(filtro === "listas") vista = l.filter(f => !f.entregada && f.paso >= PASOS.length);
  if(filtro === "entregadas") vista = l.filter(f => f.entregada);

  const tabla = document.getElementById("tabla");
  if(!vista.length){
    tabla.innerHTML = `<div class="card-dark empty">No hay fichas para este filtro.<br><a href="pedido.html" style="color:var(--accent);font-weight:700">Cargar un pedido de prueba →</a></div>`;
    return;
  }

  tabla.innerHTML = `<table class="fichas">
    <thead><tr><th>Ficha</th><th>Cliente</th><th>Servicio</th><th>Estado</th><th></th></tr></thead>
    <tbody>${vista.map(f => {
      const num = String(f.n).padStart(3,"0");
      const estado = f.entregada ? "Entregada" : (f.paso >= PASOS.length ? "Lista" : PASOS[f.paso]);
      const cls = f.entregada ? "entregada" : (f.paso >= PASOS.length ? "lista" : "taller");
      const cta = f.entregada ? "" : (f.paso >= PASOS.length ? "Entregada" : PASOS[f.paso+1] ? "→ " + PASOS[f.paso+1] : "Marcar lista");
      return `<tr style="${f.entregada ? "opacity:.6" : ""}">
        <td><span class="num" style="font-size:.95rem;font-weight:900;color:${f.entregada ? "var(--faint)" : "var(--accent)"}">${num}</span></td>
        <td><div class="col"><span style="color:var(--ink);font-weight:600;font-size:.85rem">${f.nombre}</span><span style="font-size:.7rem">${f.barrio} · ${f.pares.length} ${f.pares.length===1?"par":"pares"} · ${f.tel}</span></div></td>
        <td>${f.servicio}<br><span class="num" style="font-size:.7rem">${money(f.total)}</span></td>
        <td><span class="state ${cls}">${estado}</span></td>
        <td>
          <div class="row" style="gap:6px;justify-content:flex-end;align-items:center">
            <a href="ficha.html?id=${f.n}" style="font-size:.72rem;font-weight:600;color:var(--faint);padding:9px 10px">Ver</a>
            <button data-back="${f.n}" title="Retroceder un paso" style="font-size:.85rem;color:var(--faint);padding:9px 10px">↺</button>
            ${cta ? `<button data-next="${f.n}" class="btn-acento" style="padding:9px 13px;font-size:.72rem">${cta}</button>` : ""}
            <a href="https://wa.me/${TEL_TALLER}" class="btn-wa" style="padding:9px 12px;font-size:.72rem">WA</a>
          </div>
        </td>
      </tr>`;
    }).join("")}</tbody></table>`;

  tabla.querySelectorAll("[data-next]").forEach(b => b.onclick = () => avanzar(+b.dataset.next));
  tabla.querySelectorAll("[data-back]").forEach(b => b.onclick = () => volver(+b.dataset.back));
}

document.querySelectorAll("#filtros .pill").forEach(p => p.onclick = () => {
  document.querySelectorAll("#filtros .pill").forEach(x => x.classList.remove("sel"));
  p.classList.add("sel");
  filtro = p.dataset.f;
  pintar();
});

document.getElementById("reloj").textContent = new Date().toLocaleString("es-AR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
pintar();
</script>
</body>
</html>
